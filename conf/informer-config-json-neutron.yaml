# Informer config for neutron JSON scenario docker-compose deployment.
# The neutron JSON dataset is bind-mounted at /data/strain_map.json (read-only).
# The shared-data volume is mounted at /data for the new file and loc_dir.

source_format: json
full_file: /data/strain_map.json
new_file: /data/new_strain_map.json
labx_key: labx
labz_key: labz
values_key: "0/unconstrained_fit/3_1_1/strains/values"
copy_all_json_keys: true
loc_dir: /data/autonomous_experiment/experiment1
initial_count: 5
seed: 42

# Optional simulated measurement delay per location file (seconds)
measurement_delay_seconds: 1.0
