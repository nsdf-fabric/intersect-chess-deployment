name: Compose Scenario Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compose-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: xray-hdf5
            compose_file: scenarios/xray_ambench_smb_hdf5/docker-compose.yml
            campaign_path: scenarios/xray_ambench_smb_hdf5/campaign.json
          - name: xray-json
            compose_file: scenarios/xray_ambench_smb_json/docker-compose.yml
            campaign_path: scenarios/xray_ambench_smb_json/campaign.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate merged Compose config
        run: docker compose -f ${{ matrix.scenario.compose_file }} config > /tmp/compose-${{ matrix.scenario.name }}.yaml

      - name: Start scenario
        run: docker compose -f ${{ matrix.scenario.compose_file }} up -d --force-recreate

      - name: Submit campaign
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 300))
          until curl -fsS http://localhost:8000/v1/ping >/dev/null; do
            if (( SECONDS > deadline )); then
              echo "Timed out waiting for orchestrator ping"
              docker compose -f ${{ matrix.scenario.compose_file }} ps -a
              docker compose -f ${{ matrix.scenario.compose_file }} logs --no-color orchestrator broker
              exit 1
            fi
            sleep 2
          done

          new_id="$(cat /proc/sys/kernel/random/uuid)"
          payload="$(jq --arg id "$new_id" '.id=$id' "${{ matrix.scenario.campaign_path }}")"

          curl -sS -X POST http://localhost:8000/v1/orchestrator/start_campaign \
            -H 'Authorization: 1234567890abcdef1234567890abcdef' \
            -H 'Content-Type: application/json' \
            --data "$payload"

      - name: Check service states
        run: |
          docker compose -f ${{ matrix.scenario.compose_file }} ps -a
          for svc in broker orchestrator chess-data-service; do
            cid="$(docker compose -f ${{ matrix.scenario.compose_file }} ps -q "$svc")"
            if [[ -z "$cid" ]]; then
              echo "Missing service container: $svc"
              exit 1
            fi
            running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            if [[ "$running" != "true" ]]; then
              echo "Service is not running: $svc"
              docker compose -f ${{ matrix.scenario.compose_file }} logs --no-color "$svc"
              exit 1
            fi
          done

      - name: Validate orchestrator campaign markers
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 600))
          while true; do
            logs="$(docker compose -f ${{ matrix.scenario.compose_file }} logs --no-color orchestrator 2>/dev/null || true)"

            if echo "$logs" | grep -Eq "CAMPAIGN_ERROR|UNKNOWN_ERROR|SCHEMA_ERROR"; then
              echo "Found campaign error marker in orchestrator logs"
              echo "$logs"
              exit 1
            fi

            if echo "$logs" | grep -Eq "CAMPAIGN_COMPLETE"; then
              echo "Found campaign completion marker in orchestrator logs"
              echo "$logs" | grep -E "CAMPAIGN_COMPLETE|STEP_COMPLETE" | tail -n 10
              break
            fi

            if (( SECONDS > deadline )); then
              echo "Timed out waiting for CAMPAIGN_COMPLETE marker"
              echo "$logs" | tail -n 200
              exit 1
            fi

            sleep 2
          done

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f ${{ matrix.scenario.compose_file }} ps -a
          docker compose -f ${{ matrix.scenario.compose_file }} logs --no-color

      - name: Tear down scenario
        if: always()
        run: docker compose -f ${{ matrix.scenario.compose_file }} down --remove-orphans
