<section class="login-shell">
  <article class="login-card">
    <h2>Campaign UI Login</h2>
    <p class="hint">Sign in for full campaign editing, submit/stop actions, and monitoring. Or continue as guest for read-only monitoring.</p>

    {% if login_failed %}
      <div class="status error">Invalid username or password.</div>
    {% endif %}

    <form method="post" action="/ui/login/password" class="login-form">
      <label for="login_username">Username</label>
      <input id="login_username" name="username" type="text" autocomplete="username" required />

      <label for="login_password">Password</label>
      <input id="login_password" name="password" type="password" autocomplete="current-password" required />

      <div class="actions">
        <button type="submit" class="btn-primary">Login</button>
      </div>
    </form>

    <form method="post" action="/ui/login/guest" class="login-form">
      <div class="actions">
        <button type="submit" class="btn-ghost">Login As Guest</button>
      </div>
    </form>
  </article>
</section>
