services:
  broker:
    image: bitnamilegacy/rabbitmq:3.13.3
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_mqtt"
      RABBITMQ_USERNAME: "intersect_username"
      RABBITMQ_PASSWORD: "intersect_password"
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "yes"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 5
      start_period: 15s
      timeout: 10s

  mongodb:
    image: bitnamilegacy/mongodb:8.0
    ports:
      - "27017:27017"
    volumes:
      - dial_mongodb_data:/bitnami/mongodb

  informer:
    image: ghcr.io/nsdf-fabric/chess-instrument-control-informer:0.2.1
    environment:
      CHESS_MEASUREMENT_DELAY_SECONDS: "${CHESS_MEASUREMENT_DELAY_SECONDS:-1.0}"
    volumes:
      - shared-data:/data
      - ../../datasets/${NEUTRON_DATASET_JSON:-A2_2p1_30layers_VDriveSPF_LD.json}:/data/strain_map.json:ro
      - ../../conf/informer-config-json-neutron.yaml:/app/config.yaml:ro
    command: ["sh", "-c", "mkdir -p /data/autonomous_experiment/experiment1 && chess-instrument-control-informer --config /app/config.yaml"]
    depends_on:
      broker:
        condition: service_healthy

  chess-data-service:
    image: ghcr.io/nsdf-fabric/intersect-chess-data-service:0.1.5
    volumes:
      - shared-data:/data:ro
      - ../../conf/data-service.json:/app/local-conf.json:ro
    depends_on:
      broker:
        condition: service_healthy

  dial:
    image: ghcr.io/intersect-dial/dial:develop
    volumes:
      - ../../conf/dial-service.json:/app/local-conf.json:ro
    depends_on:
      broker:
        condition: service_healthy
      mongodb:
        condition: service_started

  chess-instrument-control-service:
    image: ghcr.io/nsdf-fabric/intersect-chess-instrument-control-service:0.1.2
    volumes:
      - shared-data:/data
      - ../../conf/instrument-control-service.json:/app/local-conf.json:ro
    depends_on:
      broker:
        condition: service_healthy

  orchestrator:
    image: ghcr.io/intersect-sdk/campaign-orchestrator:v0.1.4
    ports:
      - "8000:8000"
    environment:
      PRODUCTION: "true"
      API_KEY: "1234567890abcdef1234567890abcdef"
      BROKER_HOST: broker
      BROKER_PORT: 5672
      BROKER_PROTOCOL: amqp0.9.1
      BROKER_USERNAME: intersect_username
      BROKER_PASSWORD: intersect_password
      SYSTEM_NAME: campaign-system
      CAMPAIGN_REPOSITORY_BACKEND: memory
    depends_on:
      broker:
        condition: service_healthy
      mongodb:
        condition: service_started

  campaign-ui:
    build:
      context: ../../campaign-ui
    ports:
      - "8081:8080"
    environment:
      CAMPAIGN_UI_API_KEY: "1234567890abcdef1234567890abcdef"
      CAMPAIGN_UI_ORCH_BASE_URL: "http://orchestrator:8000"
      CAMPAIGN_PRELOAD_DIR: "/campaigns"
      CAMPAIGN_UI_DEFAULT_PRELOADED_CAMPAIGN: "scenarios/neutron_ammdf_vulcan_json-storage/campaign.json"
    volumes:
      - ../../conf:/campaigns/conf:ro
      - ../../scenarios:/campaigns/scenarios:ro
    depends_on:
      orchestrator:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.local-data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: nsdf-storage
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "waiting for minio..."
          sleep 1
        done

        mc mb -p "local/$${MINIO_BUCKET}" || true
        mc anonymous set none "local/$${MINIO_BUCKET}" || true
        echo "minio bucket ready: $${MINIO_BUCKET}"

  nsdf-storage-service:
    image: ghcr.io/nsdf-fabric/nsdf-storage-service:shim-payload-to-snapshot
    volumes:
      - ./nsdf-storage-local-conf.json:/app/local-conf.json:ro
      - ./.local-data/nsdf-storage-service:/app/data
    depends_on:
      broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  shared-data:
    driver: local
  dial_mongodb_data:
    driver: local
